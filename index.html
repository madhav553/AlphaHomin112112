<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Homingle Test Build</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Homingle working model. One phone-sized stage; every screen is Night (you, your account, money) or Day (rooms, people, chats). */
:root {
  color-scheme: light;
  --ink: #11211E; --mint: #19E6C4; --teal: #0B6B5D; --mist: #9DB8B4; --paper: #F4F7F6;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  /* day values are the defaults */
  --bg: #F4F7F6; --fg: #11211E; --mut: #56635E; --card: #FFFFFF; --line: #E1E5E1; --bord: #C9D0CB;
  --acc: #0B6B5D; --tint-bg: #D6F7EE; --tint-fg: #0B6B5D;
  --pri-bg: #11211E; --pri-fg: #FFFFFF; --sec-bg: #FFFFFF; --sec-fg: #11211E; --sec-bd: #C9D0CB;
  --on-bg: #19E6C4; --on-fg: #11211E; --on-bd: #11211E; --off-bg: #FFFFFF;
  --field: #FFFFFF; --amb-bg: #FBEBD0; --amb-fg: #8A4B08; --red: #B42318; --grey-bg: #E9ECE9; --grey-fg: #56635E;
  --nav: #FFFFFF; --sheet: #FFFFFF; --me-bg: #19E6C4; --me-fg: #11211E; --bar: #11211E; --bar-off: #D5DBD6;
  --soft: #F4F7F6; --ring-bg: #11211E; --stage: #DDE4E1; --scrim: rgba(17, 33, 30, 0.6);
}
.night {
  color-scheme: dark;
  --bg: #11211E; --fg: #FFFFFF; --mut: #9DB8B4; --card: rgba(255, 255, 255, 0.08); --line: rgba(255, 255, 255, 0.12); --bord: rgba(255, 255, 255, 0.28);
  --acc: #19E6C4; --tint-bg: rgba(25, 230, 196, 0.14); --tint-fg: #19E6C4;
  --pri-bg: #19E6C4; --pri-fg: #11211E; --sec-bg: rgba(255, 255, 255, 0.06); --sec-fg: #FFFFFF; --sec-bd: rgba(255, 255, 255, 0.28);
  --on-bg: #19E6C4; --on-fg: #11211E; --on-bd: #19E6C4; --off-bg: transparent;
  --field: rgba(255, 255, 255, 0.06); --amb-bg: rgba(255, 196, 107, 0.16); --amb-fg: #FFC46B; --red: #FF8E80; --grey-bg: rgba(255, 255, 255, 0.10); --grey-fg: #9DB8B4;
  --nav: #0D1A18; --sheet: #1B2E2A; --me-bg: #19E6C4; --me-fg: #11211E; --bar: #19E6C4; --bar-off: rgba(255, 255, 255, 0.18);
  --soft: rgba(255, 255, 255, 0.06); --ring-bg: rgba(255, 255, 255, 0.06); --scrim: rgba(4, 10, 9, 0.72);
}
html, body { height: 100%; }
body { margin: 0; background: var(--stage); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
* { box-sizing: border-box; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--acc); }
:focus-visible { outline: 2.5px solid var(--mint); outline-offset: 2px; }
svg { flex-shrink: 0; }
#phone { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#phone input, #phone textarea { -webkit-user-select: text; user-select: text; }

/* ---------- stage and phone ---------- */
#stage { height: 100%; display: flex; align-items: center; justify-content: center; }
#phone { position: relative; width: 100%; height: 100%; max-width: 430px; background: var(--bg); overflow: hidden; display: flex; flex-direction: column; isolation: isolate; }
@media (min-width: 520px) and (min-height: 700px) {
  #phone { height: min(100% - 32px, 900px); border-radius: 36px; box-shadow: 0 24px 60px rgba(17, 33, 30, 0.28), 0 0 0 10px #0B1614; }
}
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); overflow: hidden; }
.scr.enter { animation: scr-in 200ms ease-out; }
.scr.enter-back { animation: scr-back 200ms ease-out; }
@keyframes scr-in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@keyframes scr-back { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .scr.enter, .scr.enter-back, .sheet, .dialog, .toast, .pushnote { animation: none !important; } }
#hot { position: absolute; top: 0; left: 0; right: 0; height: 30px; z-index: 5; pointer-events: none; -webkit-touch-callout: none; }   /* press and hold: tester menu */

/* ---------- layout ---------- */
.col { display: flex; flex-direction: column; }
.rowx { display: flex; align-items: center; }
.grow { flex: 1; min-width: 0; }
.top { display: flex; align-items: center; gap: 4px; padding: 44px 8px 8px; flex-shrink: 0; }
.top .title { flex: 1; font-size: 17px; font-weight: 800; }
.big { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; padding: 52px 16px 12px; flex-shrink: 0; }
.big h1 { margin: 0; font-size: 24px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; }
.big p { margin: 2px 0 0; color: var(--mut); font-size: 14px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 8px 24px 28px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.scroll > * { flex-shrink: 0; }
.scroll.tight { padding: 0 16px 16px; gap: 12px; }
.scroll.wide { padding: 8px 16px 28px; gap: 16px; }
.scroll.flush { padding: 0; gap: 0; }
.foot { flex-shrink: 0; padding: 12px 24px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.foot.wide { padding-left: 16px; padding-right: 16px; }
.gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap14 { gap: 14px; } .gap16 { gap: 16px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.mt-auto { margin-top: auto; }
.center { text-align: center; }

/* ---------- type ---------- */
.h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
.h1.s { font-size: 23px; }
.h2 { margin: 0; font-size: 17px; font-weight: 800; }
.p { margin: 0; color: var(--mut); font-size: 15px; }
.p.s { font-size: 14px; }
.cap { margin: 0; color: var(--mut); font-size: 12px; line-height: 1.4; }
.cap.b { font-weight: 700; }
.sub { margin: 0; font-size: 13px; font-weight: 800; color: var(--mut); text-transform: uppercase; letter-spacing: 0.05em; }
.label { font-size: 13px; font-weight: 700; }
.mut { color: var(--mut); }
.acc { color: var(--acc); }
.b8 { font-weight: 800; } .b7 { font-weight: 700; } .b6 { font-weight: 600; }
.s13 { font-size: 13px; } .s14 { font-size: 14px; } .s12 { font-size: 12px; }
.amb { color: var(--amb-fg); }
.nowrap { white-space: nowrap; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- buttons ---------- */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 22px; border-radius: 28px; border: 1.5px solid transparent; background: var(--pri-bg); color: var(--pri-fg); font-weight: 700; font-size: 16px; text-decoration: none; text-align: center; width: 100%; }
.btn.sec { background: var(--sec-bg); color: var(--sec-fg); border-color: var(--sec-bd); }
.btn.danger { background: #B42318; color: #FFFFFF; }
.btn.sm { min-height: 44px; padding: 0 16px; font-size: 14px; width: auto; }
.btn.sm.full { width: 100%; }
.btn.tight { padding: 0 8px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.red { color: var(--red); }
.link { display: flex; align-items: center; justify-content: center; min-height: 44px; background: none; border: none; padding: 0 12px; font-weight: 700; font-size: 15px; color: var(--acc); text-decoration: none; }
.link.left { justify-content: flex-start; padding: 0; }
.link.s { font-size: 14px; }
.link.mut { color: var(--mut); }
.link.red { color: var(--red); }
.icb { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--fg); border-radius: 12px; background: none; border: none; padding: 0; flex-shrink: 0; position: relative; }
.rb { position: absolute; top: 44px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #11211E; display: flex; align-items: center; justify-content: center; border: none; padding: 0; box-shadow: 0 1px 4px rgba(17, 33, 30, 0.18); }
.rb.on { color: #B42318; }
.rb.on svg { fill: #B42318; }

/* ---------- surfaces ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 24px; }
.card.pad { padding: 16px; }
.card.tap { text-decoration: none; color: inherit; display: flex; width: 100%; text-align: left; font: inherit; }
.tintbox { background: var(--tint-bg); border-radius: 24px; padding: 14px 16px; }
.dash { border: 1.5px dashed var(--bord); border-radius: 24px; padding: 16px; }
.hr { height: 1px; background: var(--line); }

/* ---------- inputs ---------- */
.fld { display: flex; flex-direction: column; gap: 8px; }
.inp { width: 100%; min-height: 56px; padding: 0 16px; border: 1.5px solid var(--bord); border-radius: 16px; background: var(--field); font-size: 16px; color: var(--fg); }
textarea.inp { min-height: 96px; padding: 12px 16px; resize: none; }
.inp::placeholder { color: var(--mut); opacity: 0.85; }
.inp.err { border-color: var(--red); }
.errtx { color: var(--red); font-size: 13px; font-weight: 600; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1.5px solid var(--bord); background: var(--off-bg); color: var(--fg); font-size: 14px; font-weight: 600; white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.chip.on { border-color: var(--on-bd); background: var(--on-bg); color: var(--on-fg); }
.hchips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.hchips::-webkit-scrollbar { display: none; }
fieldset { border: none; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 700; }
.scale { display: flex; justify-content: space-between; }
.scale button { width: 52px; height: 52px; border-radius: 26px; border: 1.5px solid var(--bord); background: var(--off-bg); color: var(--fg); font-size: 16px; font-weight: 800; }
.scale button.on { background: var(--on-bg); border-color: var(--on-bd); color: var(--on-fg); }
.stepper { display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 22px; border: 1.5px solid var(--bord); background: var(--off-bg); color: var(--fg); display: flex; align-items: center; justify-content: center; }
.switch { width: 46px; height: 28px; border-radius: 14px; background: var(--bar-off); display: flex; align-items: center; padding: 3px; flex-shrink: 0; }
.switch.on { background: var(--acc); justify-content: flex-end; }
.switch span { width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--acc); flex-shrink: 0; }
.radio.on { background: var(--acc); box-shadow: inset 0 0 0 3px var(--sheet-or-bg, var(--bg)); }
.plan { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 16px; border: 2px solid var(--bar-off); background: var(--field); width: 100%; font-size: 16px; }
.plan.on { border-color: var(--acc); background: var(--tint-bg); }
.prog { padding: 0 24px 4px; flex-shrink: 0; }
.prog .bars { display: grid; gap: 6px; }
.prog .bars span { height: 4px; border-radius: 2px; background: var(--bar-off); }
.prog .bars span.on { background: var(--bar); }

/* ---------- pills, avatars, photos ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; min-height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--tint-bg); color: var(--tint-fg); }
.pill.grey { background: var(--grey-bg); color: var(--grey-fg); }
.pill.amber { background: var(--amb-bg); color: var(--amb-fg); }
.pill.white { background: #FFFFFF; color: #11211E; }
.pill.match { background: #19E6C4; color: #11211E; }
.pill.onph { background: #FFFFFF; color: #0B6B5D; }
.pill.eb { background: #E6E1FF; color: #3F2F9E; }
.pill.opench { background: #FFFFFF; color: #0B6B5D; }
.pill.opench.ol { box-shadow: inset 0 0 0 1.5px #0B6B5D; }
.badge1 { display: flex; gap: 6px; flex-wrap: wrap; align-self: flex-start; margin-bottom: 4px; }
.listed { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: var(--mut); margin-top: 2px; }
.selw { position: relative; }
.selw svg { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--mut); }
.inp.sel { -webkit-appearance: none; appearance: none; padding-right: 44px; cursor: pointer; }
.inp.sel option { color: #11211E; background: #FFFFFF; }
.pill.onph.q { color: #56635E; }
.ichip { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 0 12px; border-radius: 15px; background: var(--tint-bg); color: var(--tint-fg); font-size: 13px; font-weight: 700; white-space: nowrap; }
.av { border-radius: 50%; object-fit: cover; object-position: center 22%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--tint-bg); color: var(--tint-fg); font-weight: 800; }
.av svg { width: 100%; height: 100%; display: block; }
.night img.av { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.24); }
.ph { display: block; width: 100%; object-fit: cover; background: var(--grey-bg); }
.phslot { background: repeating-linear-gradient(135deg, var(--grey-bg) 0 12px, transparent 12px 24px); display: flex; align-items: center; justify-content: center; color: var(--mut); font-size: 12px; font-weight: 700; }
.bigicon { width: 64px; height: 64px; border-radius: 50%; background: var(--tint-bg); color: var(--tint-fg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ring { align-self: center; width: 108px; height: 108px; border-radius: 50%; border: 7px solid #19E6C4; background: var(--ring-bg); color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring b { font-size: 27px; font-weight: 800; line-height: 1.1; }
.ring span { font-size: 12px; font-weight: 700; color: #9DB8B4; }

/* ---------- lists ---------- */
.menu { background: var(--card); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; }
.mlink { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 16px; text-decoration: none; border: none; border-bottom: 1px solid var(--line); color: var(--fg); background: none; width: 100%; text-align: left; }
.menu > :last-child { border-bottom: none; }
.mlink .ic { display: flex; color: var(--mut); }
.mlink.red, .mlink.red .ic { color: var(--red); }
.nrow { display: flex; align-items: flex-start; gap: 12px; min-height: 64px; padding: 12px 16px; text-decoration: none; color: var(--fg); border: none; border-bottom: 1px solid var(--line); background: var(--card); width: 100%; text-align: left; }
.nrow .dot { width: 36px; height: 36px; border-radius: 50%; background: var(--tint-bg); color: var(--tint-fg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.nrow.unread { background: var(--tint-bg); }
.nrow.unread .dot { background: var(--card); }
.mrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 40px; border-bottom: 1px solid var(--line); }
.mrow span:first-child { color: var(--mut); font-size: 14px; }
.mrow span:last-child { font-weight: 700; font-size: 14px; text-align: right; }
.mrow.warn span:last-child { color: var(--amb-fg); }
.krow { display: flex; justify-content: space-between; gap: 12px; min-height: 48px; align-items: center; border-bottom: 1px solid var(--line); }
.krow:last-child { border-bottom: none; }
.krow span:first-child { color: var(--mut); font-size: 14px; }
.krow span:last-child { font-weight: 800; text-align: right; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.tile b { display: block; font-weight: 700; font-size: 14px; }
.ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ul li { display: flex; gap: 10px; align-items: flex-start; }
.ul li > span:first-child { flex-shrink: 0; margin-top: 1px; display: flex; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.steps .n { width: 28px; height: 28px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--acc); color: var(--acc); font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.banner { display: flex; gap: 10px; align-items: flex-start; background: var(--tint-bg); border-radius: 14px; padding: 12px 14px; color: var(--tint-fg); font-size: 14px; font-weight: 600; }
.hint { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--mut); }
.hint > span:first-child, .banner > span:first-child { display: flex; flex-shrink: 0; margin-top: 1px; }
.testnote { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; font-weight: 600; color: var(--amb-fg); background: var(--amb-bg); border-radius: 12px; padding: 8px 12px; }

/* ---------- bottom nav ---------- */
.nav { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--nav); border-top: 1px solid var(--line); padding: 6px 2px calc(14px + env(safe-area-inset-bottom, 0px)); flex-shrink: 0; }
.nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; background: none; border: none; font-size: 11px; font-weight: 700; color: var(--mut); position: relative; padding: 0; }
.nav button.on { color: var(--acc); }
.badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #B42318; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

/* ---------- feed ---------- */
.feat { display: flex; flex-direction: column; overflow: hidden; width: 264px; flex-shrink: 0; }
.feedcard { display: flex; flex-direction: column; overflow: hidden; }
.rowcard { display: flex; gap: 12px; padding: 12px; }
.price small { font-weight: 500; font-size: 12px; color: var(--mut); }
.tagline { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--mut); }
.tagline.free { color: var(--acc); }
.rel { position: relative; }
.abs-l { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; }
.abs-r { position: absolute; right: 10px; top: 10px; }
.waitbox { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: var(--amb-bg); color: var(--fg); }
.waitbox .amb { color: var(--amb-fg); display: flex; }
.abs-bl { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; }
.person { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05); overflow: hidden; }
.pbtn { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 12px; border-radius: 24px; border: none; font-weight: 700; font-size: 15px; background: var(--grey-bg); color: var(--fg); }
.pbtn.pri { background: var(--pri-bg); color: var(--pri-fg); }
.amen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; padding: 14px 16px; }
.amen span { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; }
.amen svg { color: var(--acc); }
.ltile { background: var(--soft); border-radius: 24px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.stat { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; background: var(--soft); border-radius: 14px; }
.stat b { font-size: 22px; font-weight: 800; line-height: 1.15; }
.stat span { font-size: 13px; color: var(--mut); }
.skel { border-radius: 24px; background: linear-gradient(90deg, var(--grey-bg) 25%, var(--card) 50%, var(--grey-bg) 75%); background-size: 200% 100%; animation: skel 1.1s linear infinite; }
@keyframes skel { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* ---------- chat ---------- */
.chatbar { display: flex; align-items: center; gap: 8px; padding: 44px 8px 10px; background: var(--card); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.day .chatbar, .day .composer, .day .lockbar { background: #FFFFFF; }
.bubble { align-self: flex-start; max-width: 78%; background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 10px 14px; overflow-wrap: anywhere; }
.bubble.me { align-self: flex-end; background: var(--me-bg); color: var(--me-fg); border: none; border-radius: 16px 16px 4px 16px; }
.bubble time { display: block; font-size: 11px; opacity: 0.6; margin-top: 2px; }

function mlink(icon, title, sub, action, o, cls) {
  return '<button class="mlink ' + (cls || '') + '"' + at(action, o) + '><span class="ic">' + ic(icon, 20) + '</span><span class="col grow"><span class="b7">' + title + '</span>' + (sub ? '<span class="s13 mut">' + sub + '</span>' : '') + '</span><span class="ic">' + ic('chev', 18) + '</span></button>';
}
function menu(rows) { return '<div class="menu">' + rows.join('') + '</div>'; }
function steps(items) {
  return '<ol class="steps">' + items.map(function (x, i) { return '<li><span class="n">' + (i + 1) + '</span><span class="col"><span class="b8">' + x[0] + '</span><span class="s14 mut">' + x[1] + '</span></span></li>'; }).join('') + '</ol>';
}
function detail(icon, title, sub) { return '<div class="rowx gap12" style="align-items: flex-start"><span class="acc" style="display: flex; margin-top: 2px">' + ic(icon) + '</span><span class="col"><span class="b8">' + title + '</span><span class="s14 mut">' + sub + '</span></span></div>'; }
function prog(n, total, label) {
  var b = ''; for (var i = 0; i < total; i++) b += '<span class="' + (i < n ? 'on' : '') + '"></span>';
  return '<div class="prog"><div class="col gap8"><div class="bars" style="grid-template-columns: repeat(' + total + ', minmax(0, 1fr))">' + b + '</div><p class="cap b">' + label + '</p></div></div>';
}
function stat(v, label) { return '<div class="stat"><b>' + v + '</b><span>' + label + '</span></div>'; }
function sw(path, title, sub) {
  var on = !!getPath(path);

}

// ---------- the feed ----------
function feedRooms() {
  var f = S.filters, me = S.me;
  var list = ROOM_ORDER.map(function (id) { return ROOMS[id]; }).filter(roomVisible).filter(genderOk);
  if (me.areas.length) list = list.filter(function (r) { return me.areas.indexOf(r.area) >= 0; });
  var min = parseInt(String(f.min || '').replace(/\D/g, ''), 10), max = parseInt(String(f.max || '').replace(/\D/g, ''), 10);
  if (min) list = list.filter(function (r) { return r.rent >= min; });
  if (max) list = list.filter(function (r) { return r.rent <= max; });
  if (f.room !== 'Any') list = list.filter(function (r) { return r.room === f.room; });
  if (f.furnishing !== 'Any') list = list.filter(function (r) { return r.furn === f.furnishing; });
  if (f.flatmates !== 'Anyone') list = list.filter(function (r) { return r.gender === f.flatmates; });
  if (f.kitchen !== 'Any') list = list.filter(function (r) { return r.kitchen === 'Vegetarian only'; });
  if (f.movein === 'This month' || f.movein === 'Next month') { var nowD = new Date(now()), want = (nowD.getMonth() + (f.movein === 'Next month' ? 1 : 0)) % 12;
    list = list.filter(function (r) { return new Date(Math.max(now(), roomFrom(r))).getMonth() === want; }); }
  if (f.free) list = list.filter(function (r) { return !roomEarly(r); });
  var score = function (r) { var m = matchRoom(r.id); return m ? m.pct : 0; };
  if (f.sort === 'Newest first') list.sort(function (a2, b) { return a2.age - b.age; });
  else if (f.sort === 'Rent: low to high') list.sort(function (a2, b) { return a2.rent - b.rent; });
  else if (f.sort === 'Rent: high to low') list.sort(function (a2, b) { return b.rent - a2.rent; });
  else list.sort(function (a2, b) { return score(b) - score(a2); });
  return list;
